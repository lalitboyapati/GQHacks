[project]
name = "backtrader-example"
version = "0.1.0"
description = "Shared GQHacks engines: Webull/Backtrader (webull_bt) and 8-K event-study (eightk)"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "backtrader>=1.9.78.123",
    "webull-openapi-python-sdk>=3.0.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.20.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "requests>=2.31.0",
    "massive>=1.0.0",
    "databento>=0.34.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Reusable libraries only; examples/ and tracks/ stay outside the package.
[tool.setuptools]
packages = ["webull_bt", "eightk"]

[tool.pytest.ini_options]
testpaths = ["../tracks/disclosure_advantage/tests", "../tracks/item_202_results_ops/tests", "tests/test_webull_prices.py"]
